services:
  mysql:
    image: mysql:8.4
    container_name: temu-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-temu_monitor}
      MYSQL_USER: ${DB_USER:-temu_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - temu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  temu-price-dashboard:
    build: .
    image: temu-price-dashboard:latest
    container_name: temu-price-dashboard
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3106}:3106"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 3106
      DATA_SOURCE: db
      ENABLE_LOCAL_REFRESH: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-temu_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-temu_monitor}
      RETURN_LABEL_APP_URL: ${RETURN_LABEL_APP_URL:-}
      RETURN_LABEL_APP_PORT: ${RETURN_LABEL_APP_PORT:-3206}
      TEMU_OFFICIAL_UPLOAD_TOKEN: ${TEMU_OFFICIAL_UPLOAD_TOKEN:-}
      TEMU_OFFICIAL_UPLOAD_LIMIT: ${TEMU_OFFICIAL_UPLOAD_LIMIT:-20mb}
      PRICE_TITLE_TRANSLATION_PROVIDER: ${PRICE_TITLE_TRANSLATION_PROVIDER:-libretranslate}
      PRICE_TITLE_TRANSLATION_LOCAL_FIRST: ${PRICE_TITLE_TRANSLATION_LOCAL_FIRST:-true}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      PRICE_TITLE_TRANSLATION_BATCH_SIZE: ${PRICE_TITLE_TRANSLATION_BATCH_SIZE:-10}
      TRANSLATION_FETCH_TIMEOUT_MS: ${TRANSLATION_FETCH_TIMEOUT_MS:-30000}
      BACKEND_OFFICIAL_TITLE_MIN_MATCH_THRESHOLD: ${BACKEND_OFFICIAL_TITLE_MIN_MATCH_THRESHOLD:-0.15}
      BACKEND_OFFICIAL_TITLE_MATCH_STEP: ${BACKEND_OFFICIAL_TITLE_MATCH_STEP:-0.05}
    volumes:
      - temu_dashboard_data:/app/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: temu-libretranslate
    restart: unless-stopped
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,de,zh,fr,es,it}
      LT_UPDATE_MODELS: ${LT_UPDATE_MODELS:-true}
    volumes:
      - temu_libretranslate_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  temu_mysql_data:
  temu_libretranslate_data:
  temu_dashboard_data:
